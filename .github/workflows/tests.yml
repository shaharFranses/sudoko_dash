# GUT test suite, headless Godot 4.3. Runs on every PR and is reused by the staging and release pipelines.
name: Tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  gut:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: timeout 600 godot --headless --editor --quit --path . || true
      - name: Run GUT
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit 2>&1 | tee gut.log
      - name: Report script errors
        if: always()
        shell: bash
        run: |
          n=$(grep -c 'SCRIPT ERROR' gut.log || true)
          echo "SCRIPT ERROR lines: ${n:-0}"
          if [ "${n:-0}" != "0" ]; then
            echo "::warning::${n} SCRIPT ERROR lines in the test run (GUT counts them as risky, not failed)"
            grep -m 20 -A2 'SCRIPT ERROR' gut.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gut-log
          path: gut.log
