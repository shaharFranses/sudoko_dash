<script>
/* CrazyGames SDK v3 glue for Sudoku Dash. The SDK script is only loaded on the CrazyGames portal
   (or with ?cgsdk=1); elsewhere the game uses its offline ad mock and localStorage. */
window.SD_CG = (function () {
  var st = {}, n = 0, ok = false, env = 'none', adblock = false;
  var portal = /crazygames\./.test(location.hostname) || location.search.indexOf('cgsdk=1') >= 0;
  if (portal) {
    var s = document.createElement('script');
    s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    s.onload = function () {
      window.CrazyGames.SDK.init().then(function () {
        env = window.CrazyGames.SDK.environment; ok = true;
        window.CrazyGames.SDK.ad.hasAdblock().then(function (b) { adblock = !!b; }).catch(function () { adblock = true; });
      }).catch(function () { ok = false; });
    };
    s.onerror = function () { ok = false; };
    document.head.appendChild(s);
  }
  function cg() { return ok && env === 'crazygames' ? window.CrazyGames.SDK : null; }
  return {
    portal: function () { return portal; },
    available: function () { return !!cg() && !adblock && navigator.onLine; },
    request: function (type) {
      var id = ++n; st[id] = 'pending';
      try {
        cg().ad.requestAd(type, {
          adStarted: function () {}, adFinished: function () { st[id] = 'finished'; },
          adError: function () { st[id] = 'error'; }
        });
      } catch (e) { st[id] = 'error'; }
      return id;
    },
    status: function (id) { return st[id] || 'none'; },
    gameplay: function (on) { try { if (cg()) { on ? cg().game.gameplayStart() : cg().game.gameplayStop(); } } catch (e) {} },
    save: function (k, v) {
      try { localStorage.setItem(k, v); } catch (e) {}
      try { if (cg()) cg().data.setItem(k, v); } catch (e) {}
    },
    load: function (k) {
      try { if (cg()) { var v = cg().data.getItem(k); if (v) return v; } } catch (e) {}
      try { return localStorage.getItem(k); } catch (e) { return null; }
    }
  };
})();
</script>
<style>body{background:#bfe3ef;} #status{background:#bfe3ef;}</style>
