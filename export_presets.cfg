html/head_include="<script>\n/* CrazyGames SDK v3 glue for Sudoku Dash. The SDK script is only loaded on the CrazyGames portal\n   (or with ?cgsdk=1); elsewhere the game uses its offline ad mock and localStorage. */\nwindow.SD_CG = (function () {\n  var st = {}, n = 0, ok = false, env = 'none', adblock = true, adblockKnown = false, settled = false, stopPending = false;\n  var portal = /crazygames\\./.test(location.hostname) || location.search.indexOf('cgsdk=1') >= 0;\n  if (portal) {\n    var s = document.createElement('script');\n    s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';\n    s.onload = function () {\n      window.CrazyGames.SDK.init().then(function () {\n        env = window.CrazyGames.SDK.environment; ok = true; settled = true;\n        try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}\n        if (stopPending) { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} }\n        window.CrazyGames.SDK.ad.hasAdblock().then(function (b) { adblock = !!b; adblockKnown = true; })\n          .catch(function () { adblock = true; adblockKnown = true; });\n      }).catch(function () { ok = false; settled = true; });\n    };\n    s.onerror = function () { ok = false; settled = true; };\n    document.head.appendChild(s);\n  }\n  function cg() { return ok && env === 'crazygames' ? window.CrazyGames.SDK : null; }\n  return {\n    portal: function () { return portal; },\n    ready: function () { return !portal || settled; },\n    loadingStop: function () { if (cg()) { try { cg().game.loadingStop(); } catch (e) {} } else { stopPending = true; } },\n    /* rewarded hidden until adblock detection has resolved */\n    available: function () { return !!cg() && adblockKnown && !adblock && navigator.onLine; },\n    request: function (type) {\n      var id = ++n; st[id] = 'pending';\n      try {\n        cg().ad.requestAd(type, {\n          adStarted: function () {}, adFinished: function () { st[id] = 'finished'; },\n          adError: function () { st[id] = 'error'; }\n        });\n      } catch (e) { st[id] = 'error'; }\n      return id;\n    },\n    status: function (id) { return st[id] || 'none'; },\n    gameplay: function (on) { try { if (cg()) { on ? cg().game.gameplayStart() : cg().game.gameplayStop(); } } catch (e) {} },\n    save: function (k, v) {\n      try { localStorage.setItem(k, v); } catch (e) {}\n      try { if (cg()) cg().data.setItem(k, v); } catch (e) {}\n    },\n    load: function (k) {\n      try { if (cg()) { var v = cg().data.getItem(k); if (v) return v; } } catch (e) {}\n      try { return localStorage.getItem(k); } catch (e) { return null; }\n    }\n  };\n})();\n</script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"format-detection\" content=\"telephone=no\">\n<style>\nhtml, body, canvas { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;\n  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }\n/* Mobile: the page never scrolls, bounces or zooms; the canvas owns every touch. */\nhtml, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;\n  -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\nbody { position: fixed; inset: 0; }\n/* Safe-area insets (notch / home bar), read by the game through SD_VIEW.insets(). */\n:root { --sd-sat: env(safe-area-inset-top, 0px); --sd-sar: env(safe-area-inset-right, 0px);\n  --sd-sab: env(safe-area-inset-bottom, 0px); --sd-sal: env(safe-area-inset-left, 0px); }\n/* PKD studio intro v1.1: plain navy loader (progress bar only); the PKD mark appears once, at the end of the morph. */\nbody, #status { background-color: #1E1B3A !important; }\n#status-splash { visibility: hidden !important; }\n</style>\n<script>\n/* Mobile view glue: one viewport meta (ours, the last), safe-area insets for the game, and no browser\n   zoom / scroll gestures (iOS Safari ignores user-scalable=no, so pinch and double-tap are blocked here). */\n(function () {\n  function dedupeViewport() {\n    var m = document.querySelectorAll('meta[name=viewport]');\n    for (var i = 0; i < m.length - 1; i++) m[i].parentNode.removeChild(m[i]);\n  }\n  dedupeViewport();\n  document.addEventListener('DOMContentLoaded', dedupeViewport);\n  window.SD_VIEW = {\n    insets: function () {\n      var s = getComputedStyle(document.documentElement);\n      return ['--sd-sat', '--sd-sar', '--sd-sab', '--sd-sal'].map(function (k) { return parseFloat(s.getPropertyValue(k)) || 0; });\n    }\n  };\n  var opt = { passive: false };\n  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(function (ev) {\n    document.addEventListener(ev, function (e) { e.preventDefault(); }, opt);\n  });\n  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, opt);\n  var lastEnd = 0;\n  document.addEventListener('touchend', function (e) {   /* iOS double-tap zoom */\n    var t = Date.now(); if (t - lastEnd < 350 && e.cancelable) e.preventDefault(); lastEnd = t;\n  }, opt);\n  window.addEventListener('scroll', function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });\n  /* Some mobile browsers report the old size right after rotating: re-announce it once it settles. */\n  window.addEventListener('orientationchange', function () {\n    setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 300);\n  });\n})();\n</script>\n<script>\n/* No context menu / long-press menu; resume Web Audio on first gesture (iOS/Safari autoplay policy). */\ndocument.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);\n(function () {\n  /* Track every Web Audio context Godot creates, and gate it: running only when\n     no ad is playing AND the tab is visible AND the window has focus. Ad state is authoritative. */\n  var ctxs = window.__sdAudioCtxs = [];\n  var st = { ad: false, focused: true };\n  function shouldRun() { return !st.ad && !document.hidden && st.focused; }\n  function apply() {\n    var run = shouldRun();\n    ctxs.forEach(function (c) {\n      try {\n        /* iOS Safari can also leave a context 'interrupted' (calls, Siri, lock screen). */\n        if (run && c.state !== 'running' && c.state !== 'closed') c.__sdResume();\n        else if (!run && c.state === 'running') c.suspend();\n      } catch (e) {}\n    });\n  }\n  ['AudioContext', 'webkitAudioContext'].forEach(function (n) {\n    var C = window[n]; if (!C) return;\n    var W = function (a, b) {\n      var c = new C(a, b); ctxs.push(c);\n      /* The engine also resumes on gestures; refuse while gated (ad / hidden / blurred). */\n      c.__sdResume = c.resume.bind(c);\n      c.resume = function () { return shouldRun() ? c.__sdResume() : Promise.resolve(); };\n      setTimeout(apply, 0); return c;\n    };\n    W.prototype = C.prototype; window[n] = W;\n  });\n  window.SD_AUDIO = {\n    setAd: function (on) { st.ad = !!on; apply(); },\n    state: function () { return { ad: st.ad, hidden: document.hidden, focused: st.focused, contexts: ctxs.map(function (c) { return c.state; }) }; },\n    apply: apply\n  };\n  document.addEventListener('visibilitychange', apply, true);\n  window.addEventListener('blur', function () { st.focused = false; apply(); }, true);\n  window.addEventListener('focus', function () { st.focused = true; apply(); }, true);\n  /* First gesture: browsers require a user gesture to start audio (iOS/Safari). */\n  ['pointerdown', 'touchend', 'keydown', 'mousedown'].forEach(function (ev) {\n    document.addEventListener(ev, function () { st.focused = true; apply(); }, true);\n  });\n})();\n</script>\n"
