 () { st[id] = 'error'; }\n        });\n      } catch (e) { st[id] = 'error'; }\n      return id;\n    },\n    status: function (id) { return st[id] || 'none'; },\n    gameplay: function (on) { try { if (cg()) { on ? cg().game.gameplayStart() : cg().game.gameplayStop(); } } catch (e) {} },\n    save: function (k, v) {\n      try { localStorage.setItem(k, v); } catch (e) {}\n      try { if (cg()) cg().data.setItem(k, v); } catch (e) {}\n    },\n    load: function (k) {\n      try { if (cg()) { var v = cg().data.getItem(k); if (v) return v; } } catch (e) {}\n      try { return localStorage.getItem(k); } catch (e) { return null; }\n    }\n  };\n})();\n</script>\n<style>body{background:#bfe3ef;} #status{background:#bfe3ef;}</style>\n"
