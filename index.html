<!DOCTYPE html>
<html lang="en">
	<head>

		<title>Sudoku Dash</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
/* CrazyGames SDK v3 glue for Sudoku Dash. The SDK script is only loaded on the CrazyGames portal
   (or with ?cgsdk=1); elsewhere the game uses its offline ad mock and localStorage. */
window.SD_CG = (function () {
  var st = {}, n = 0, ok = false, env = 'none', adblock = true, adblockKnown = false, settled = false, stopPending = false;
  var portal = /crazygames\./.test(location.hostname) || location.search.indexOf('cgsdk=1') >= 0;
  if (portal) {
    var s = document.createElement('script');
    s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    s.onload = function () {
      window.CrazyGames.SDK.init().then(function () {
        env = window.CrazyGames.SDK.environment; ok = true; settled = true;
        try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
        if (stopPending) { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} }
        window.CrazyGames.SDK.ad.hasAdblock().then(function (b) { adblock = !!b; adblockKnown = true; })
          .catch(function () { adblock = true; adblockKnown = true; });
      }).catch(function () { ok = false; settled = true; });
    };
    s.onerror = function () { ok = false; settled = true; };
    document.head.appendChild(s);
  }
  function cg() { return ok && env === 'crazygames' ? window.CrazyGames.SDK : null; }
  return {
    portal: function () { return portal; },
    ready: function () { return !portal || settled; },
    loadingStop: function () { if (cg()) { try { cg().game.loadingStop(); } catch (e) {} } else { stopPending = true; } },
    /* rewarded hidden until adblock detection has resolved */
    available: function () { return !!cg() && adblockKnown && !adblock && navigator.onLine; },
    request: function (type) {
      var id = ++n; st[id] = 'pending';
      try {
        cg().ad.requestAd(type, {
          adStarted: function () {}, adFinished: function () { st[id] = 'finished'; },
          adError: function () { st[id] = 'error'; }
        });
      } catch (e) { st[id] = 'error'; }
      return id;
    },
    status: function (id) { return st[id] || 'none'; },
    gameplay: function (on) { try { if (cg()) { on ? cg().game.gameplayStart() : cg().game.gameplayStop(); } } catch (e) {} },
    save: function (k, v) {
      try { localStorage.setItem(k, v); } catch (e) {}
      try { if (cg()) cg().data.setItem(k, v); } catch (e) {}
    },
    load: function (k) {
      try { if (cg()) { var v = cg().data.getItem(k); if (v) return v; } } catch (e) {}
      try { return localStorage.getItem(k); } catch (e) { return null; }
    }
  };
})();
</script>

<script>
/* No context menu / long-press menu; resume Web Audio on first gesture (iOS/Safari autoplay policy). */
document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
(function () {
  /* Track every Web Audio context Godot creates, and gate it: running only when
     no ad is playing AND the tab is visible AND the window has focus. Ad state is authoritative. */
  var ctxs = window.__sdAudioCtxs = [];
  var st = { ad: false, focused: true };
  function shouldRun() { return !st.ad && !document.hidden && st.focused; }
  function apply() {
    var run = shouldRun();
    ctxs.forEach(function (c) {
      try {
        if (run && c.state === 'suspended') c.__sdResume();
        else if (!run && c.state === 'running') c.suspend();
      } catch (e) {}
    });
  }
  ['AudioContext', 'webkitAudioContext'].forEach(function (n) {
    var C = window[n]; if (!C) return;
    var W = function (a, b) {
      var c = new C(a, b); ctxs.push(c);
      /* The engine also resumes on gestures; refuse while gated (ad / hidden / blurred). */
      c.__sdResume = c.resume.bind(c);
      c.resume = function () { return shouldRun() ? c.__sdResume() : Promise.resolve(); };
      setTimeout(apply, 0); return c;
    };
    W.prototype = C.prototype; window[n] = W;
  });
  window.SD_AUDIO = {
    setAd: function (on) { st.ad = !!on; apply(); },
    state: function () { return { ad: st.ad, hidden: document.hidden, focused: st.focused, contexts: ctxs.map(function (c) { return c.state; }) }; },
    apply: apply
  };
  document.addEventListener('visibilitychange', apply, true);
  window.addEventListener('blur', function () { st.focused = false; apply(); }, true);
  window.addEventListener('focus', function () { st.focused = true; apply(); }, true);
  /* First gesture: browsers require a user gesture to start audio (iOS/Safari). */
  ['pointerdown', 'touchend', 'keydown', 'mousedown'].forEach(function (ev) {
    document.addEventListener(ev, function () { st.focused = true; apply(); }, true);
  });
})();
</script>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3657136,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
